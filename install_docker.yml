---
- name: Install Docker on EC2 instances
  hosts: ec2_instances
  become: yes

  tasks:
    - name: Update apt cache (for Debian/Ubuntu)
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install prerequisite packages (Debian/Ubuntu)
      apt:
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG apt key (Debian/Ubuntu)
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker repository (Debian/Ubuntu)
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker engine (Debian/Ubuntu)
      apt:
        name: docker-ce
        state: latest
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Docker on Amazon Linux (RedHat family)
      yum:
        name: docker
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add current user to docker group
      user:
        name: "{{ ansible_ssh_user | default('ec2-user') }}"
        groups: docker
        append: yes